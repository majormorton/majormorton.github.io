main{max-width:1100px;margin:0 auto;padding:26px 20px 60px}
h1{font-weight:normal;font-size:34px;margin:10px 0 6px;color:var(--cream)}
.intro{color:#999;font-size:14px;margin-bottom:22px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
.v{display:flex;flex-direction:column;gap:6px}
.frame{position:relative;padding-top:56.25%;background:#111;cursor:pointer}
.frame iframe,.frame img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.frame .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.6);border:2px solid #fff;color:#fff;display:grid;place-items:center;font-size:20px}
.t{font-size:17px;line-height:1.3}.d{color:#999;font-size:13px}.desc{color:#bbb;font-size:14px;white-space:pre-line}
.links{columns:2 300px;column-gap:30px;font-size:15px;line-height:1.7}
.links a{color:#bbb;text-decoration:none;display:block;break-inside:avoid}.links a:hover{color:#fff;text-decoration:underline}
.d a{color:#999}
</style>

<script>
const V=JSON.parse(document.getElementById('data').textContent);
const fmt=s=>{const m=Math.floor(s/60),x=s%60;return (m>=60?Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+':':m+':')+String(x).padStart(2,'0')};
const emb=V.filter(v=>v.embed).sort((a,b)=>b.date.localeCompare(a.date));
const only=V.filter(v=>!v.embed);
document.getElementById('intro').textContent=`${V.length} films, 2017 to 2026. Hosted on Vimeo.`;
const L=document.getElementById('list');
let yr=null,grid=null;
emb.forEach(v=>{const y=v.date.slice(0,4);if(y!==yr){yr=y;const h=document.createElement('h2');h.textContent=y;L.appendChild(h);grid=document.createElement('div');grid.className='grid';L.appendChild(grid)}
 const d=document.createElement('div');d.className='v';
 d.innerHTML=`<div class="frame"><img loading="lazy" src="thumbs/${v.id}.jpg" alt=""><div class="pl">▶</div></div><div class="t"></div><div class="d">${v.date} · ${fmt(v.dur)}</div>${v.desc?'<div class="desc"></div>':''}`;
 d.querySelector('.t').textContent=v.title;if(v.desc)d.querySelector('.desc').textContent=v.desc;
 d.querySelector('.frame').addEventListener('click',function(){this.innerHTML=`<iframe src="https://player.vimeo.com/video/${v.id}?autoplay=1&dnt=1" allow="autoplay; fullscreen; picture-in-picture" title=""></iframe>`;this.querySelector('iframe').title=v.title;this.style.cursor='default'},{once:true});
 grid.appendChild(d)});
if(only.length){const h=document.createElement('h2');h.textContent='On Vimeo';L.appendChild(h);const p=document.createElement('p');p.className='d';p.textContent='These play on Vimeo rather than here.';L.appendChild(p);
 const ul=document.createElement('div');ul.className='links';only.forEach(v=>{const a=document.createElement('a');a.href='https://vimeo.com/'+v.id;a.target='_blank';a.rel='noopener';a.textContent=v.title;ul.appendChild(a)});L.appendChild(ul)}
</script>
