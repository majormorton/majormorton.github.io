<script>

var gs=document.getElementById('g-sound');shuffle(D.sound).slice(0,N).forEach(function(s){var a=document.createElement('a');a.href='/sound/#'+s.id;a.innerHTML='<img loading="lazy" alt=""><span class="cap"></span>';a.querySelector('img').src='sound/'+s.a;a.querySelector('.cap').textContent=s.t;gs.appendChild(a)});

var i=0,first=true,FLASH=["#d84624","#0a0a0a","#f5e4c8"];
